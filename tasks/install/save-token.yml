- name: 'Kubernetes | Generate new token'
  shell: 'kubeadm token create --print-join-command --ttl {{ k8s_cluster_token_ttl }}'
  register: token_var
  no_log: true

- name: 'Kubernetes | Extract token'
  ansible.builtin.set_fact:
    token: "{{ token_var.stdout | regex_search('--token ([^ ]+)', '\\1') | first }}"
    token_ca_cert_hash: "{{ token_var.stdout | regex_search('--discovery-token-ca-cert-hash ([^ ]+)', '\\1') | first }}"
  no_log: true

- name: 'Kubernetes | Save a secret to HashiCorp Vault via REST API'
  community.hashi_vault.vault_write:
    path: "secret/data/{{ k8s_master_vault_token_path }}"
    data:
      data:
        token: "{{ token }}"
        token-ca-cert-hash: "{{ token_ca_cert_hash }}"
  delegate_to: localhost
  become: false
  when: k8s_save_token_vault_enabled

