---
- name: 'Kuberntes | Create group'
  group:
    name: '{{ k8s_group }}'
    gid: '{{ k8s_gid }}'

- name: 'Kuberntes | Create directories'
  file:
    path:     '{{ item }}'
    state:    directory
    owner:    'root'
    group:    '{{ k8s_group }}'
  with_items:
    - '{{ k8s_service_path }}'
    - '{{ k8s_service_logs_path }}'
    - '{{ k8s_service_encrypted_path }}'
    - '{{ k8s_service_policy_path }}'

- name: "Kubernetes | System Updates"
  apt:
    update_cache: yes

- name: "Kubernetes | Disable Swap"
  shell: |
    swapoff -a

- name: Disable SWAP in fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
    replace: '# \1'

- name: "Kubernetes | Create an empty file for K8S sysctl parameters"
  copy:
    content: ''
    dest: '/etc/sysctl.d/{{ item }}'
    force: yes
  with_items:
    - '99-kubernetes-cri.conf'
    - '99-kubernetes-kubelet.conf'

- name: "Kubernetes | Configure sysctl parameters for K8S"
  lineinfile:
    path: /etc/sysctl.d/99-kubernetes-cri.conf
    line: "{{ item }}"
  with_items:
    - "net.bridge.bridge-nf-call-iptables  = 1"
    - "net.ipv4.ip_forward                 = 1"
    - "net.bridge.bridge-nf-call-ip6tables = 1"
    - "net.ipv4.conf.all.rp_filter         = 1"

- name: "Kubernetes | Configure sysctl parameters for Kubelet"
  lineinfile:
    path: /etc/sysctl.d/99-kubernetes-kubelet.conf
    line: "{{ item }}"
  with_items:
    - "vm.overcommit_memory = 1"
    - "kernel.panic = 10"
    - "kernel.panic_on_oops = 1"

- name: "Kubernetes | Apply sysctl parameters"
  command: sysctl --system

- name: "Kubernetes | Load br_netfilter kernel module"
  modprobe:
    name: br_netfilter
    state: present


- name: "Kubernetes | Set bridge-nf-call-iptables"
  sysctl:
    name: net.bridge.bridge-nf-call-iptables
    value: 1

- name: "Kubernetes | Set ip_forward"
  sysctl:
    name: net.ipv4.ip_forward
    value: 1
