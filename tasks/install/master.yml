---
- name: 'Kubernetes | Create kubeadm config and basic deployment'
  template:
    src: '{{ item.file }}.j2'
    dest: '{{ item.dir | default(k8s_service_path) }}/{{ item.file }}'
  with_items:
    - { file: 'kubeadm-config.yaml' }
    - { file: 'calico.yaml' }
    - { file: 'calico-network-policy.yaml' }
    - { file: 'kubernetes-sigs.yaml' }
    - { file: 'audit-policy.yaml', dir: '{{ k8s_service_policy_path }}' }
    - { file: 'encryption-config.yaml', dir: '{{ k8s_service_encrypted_path }}' }

- name: "Kubernetes | Install packages"
  apt:
    name: '{{ k8s_master_packages }}'
    state: present
    update_cache: true

- name: 'Kubernetes | Initialize the cluster'
  shell: 'kubeadm init --config /etc/kubernetes/kubeadm-config.yaml'

- name: 'Kubernetes | wait for API server to be up'
  wait_for: "host={{ k8s_master_ip }} port={{ k8s_master_api_server_port }} timeout=30"

- name: 'Kubernetes | Update admin config permission'
  file:
    path: '{{ k8s_service_path }}/admin.conf'
    owner: 'root'
    group: 'adm'
    mode: 0640

- name: 'Kubernetes | Install Pod Network'
  become: yes
  shell: 'kubectl apply -f {{ k8s_service_path }}/calico.yaml'
  environment:
    KUBECONFIG: '/etc/kubernetes/admin.conf'

- name: 'Kubernetes | Install nodes metrics'
  become: yes
  shell: 'kubectl apply -f {{ k8s_service_path }}/kubernetes-sigs.yaml'
  environment:
    KUBECONFIG: '/etc/kubernetes/admin.conf'
